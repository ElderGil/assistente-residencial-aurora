[project]
name = "aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora com Google ADK: o modelo decide o caminho, o código decide o que é permitido."
authors = [
    { name = "Elder Gil", email = "eldergil@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk[db]==2.9.1",
    "greenlet>=3.5.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "aurora.api:main"
restaurar = "aurora.restaurar:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
